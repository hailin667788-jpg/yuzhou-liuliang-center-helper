<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙流量中心小助手</title>
  <style>
    :root {
      --bg: #060b1f;
      --card: rgba(18, 26, 56, 0.88);
      --line: rgba(104, 121, 255, 0.35);
      --text: #e8eeff;
      --muted: #9db0ff;
      --cyan: #38f8ff;
      --violet: #9b7bff;
      --pink: #ff4ec7;
      --good: #4dff9e;
      --warn: #ffce4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 248, 255, 0.12), transparent 34%),
        radial-gradient(circle at 80% 30%, rgba(155, 123, 255, 0.16), transparent 36%),
        radial-gradient(circle at 50% 90%, rgba(255, 78, 199, 0.12), transparent 40%),
        linear-gradient(140deg, #030614, #0b1030 60%, #070a1f);
      min-height: 100vh;
      padding: 16px;
    }
    .layout {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      padding: 14px;
    }
    h1, h2 { margin: 0; }
    .title { font-size: 22px; background: linear-gradient(90deg, var(--cyan), var(--pink)); background-clip: text; -webkit-background-clip: text; color: transparent; }
    .sub { margin: 8px 0 12px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    label { font-size: 12px; color: #c7d6ff; display: block; margin-bottom: 5px; }
    textarea, input, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 255, 0.35);
      background: rgba(8, 13, 36, 0.9);
      color: var(--text);
      padding: 10px;
      font-size: 14px;
      margin-bottom: 9px;
    }
    textarea { min-height: 88px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    button {
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg, #3146ff, #ad44ff);
      border: none;
    }
    button.secondary { background: linear-gradient(135deg, #206c87, #294399); }
    button.danger { background: linear-gradient(135deg, #ab214f, #de3a5f); }
    .meta { font-size: 12px; line-height: 1.7; color: var(--muted); }
    .ok { color: var(--good); }
    .warn { color: var(--warn); }
    .error { color: #ff7f99; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .headline {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .headline a { color: var(--cyan); font-size: 12px; text-decoration: none; }
    .panel-title { font-size: 18px; color: #d8e1ff; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      border-bottom: 1px solid rgba(112, 130, 255, 0.25);
      font-size: 13px;
      padding: 9px 5px;
      text-align: left;
      vertical-align: middle;
    }
    th { color: #9fb2ff; font-weight: 600; }
    .rank { width: 54px; color: var(--cyan); font-weight: 700; }
    .tag {
      margin-left: 6px;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(77, 255, 158, 0.35);
      color: #8fffc6;
    }
    .hit-row { background: rgba(255, 78, 199, 0.09); }
    .hit { color: #ff9ae7; font-weight: 700; }
    .status-card {
      border: 1px dashed rgba(56, 248, 255, 0.35);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.8;
      color: #cfe4ff;
      background: rgba(15, 21, 49, 0.7);
    }
    .logs { max-height: 210px; overflow: auto; margin-top: 10px; border-top: 1px dashed rgba(112, 130, 255, 0.3); padding-top: 8px; }
    .log-item { font-size: 12px; color: #c8d8ff; padding: 5px 0; border-bottom: 1px dashed rgba(112, 130, 255, 0.2); }
    .empty { text-align: center; padding: 16px; color: #8fa4ff; }
    .logout-btn { background: rgba(80, 20, 40, 0.6); border: 1px solid rgba(255, 78, 199, 0.3); color: #ff9ae7; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; width: auto; font-weight: 500; margin-bottom: 0; }
    .logout-btn:hover { background: rgba(120, 30, 60, 0.7); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    details.cookie-section { margin-bottom: 9px; border: 1px dashed rgba(148,163,255,0.28); border-radius: 10px; padding: 8px 10px; }
    details.cookie-section summary { cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; list-style: none; }
    details.cookie-section summary::before { content: "▶ "; font-size: 10px; }
    details[open].cookie-section summary::before { content: "▼ "; }
    details.cookie-section summary:hover { color: #c7d6ff; }
    .cookie-body { margin-top: 8px; }
    .cookie-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      margin-left: 8px; vertical-align: middle; cursor: pointer;
      border: 1px solid rgba(148,163,255,0.4); white-space: nowrap;
    }
    .cookie-badge.ok { background: rgba(77,255,158,0.15); color: var(--good); border-color: rgba(77,255,158,0.5); }
    .cookie-badge.warn { background: rgba(255,206,77,0.15); color: var(--warn); border-color: rgba(255,206,77,0.5); }
    .cookie-badge.bad { background: rgba(255,127,153,0.18); color: #ff7f99; border-color: rgba(255,127,153,0.6); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (max-width: 1080px) {
      .layout { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="card">
      <div class="top-bar">
        <h1 class="title">宇宙流量中心小助手 <span id="cookieBadge" class="cookie-badge warn" title="点击展开 Cookie 配置">● 检查中</span></h1>
        <button class="logout-btn" id="logoutBtn">退出</button>
      </div>
      <p class="sub">全国热搜 + 文娱 / 生活 / 社会分榜同步，支持关键词别名匹配。</p>
      <label for="keywordsInput">关键词（每行一个，别名用 | 分隔）</label>
      <textarea id="keywordsInput" placeholder="示例：&#10;客户品牌|品牌简称&#10;客户艺人|昵称&#10;活动话题"></textarea>
      <label for="refreshSec">刷新秒数（建议 10）</label>
      <input id="refreshSec" type="number" min="5" step="1" />
      <div class="row">
        <button id="saveBtn" class="secondary">保存配置</button>
        <button id="toggleBtn">开始监控</button>
      </div>
      <div class="row">
        <button id="notifyBtn" class="secondary">开启通知</button>
        <button id="clearLogBtn" class="danger">清空日志</button>
      </div>
      <details class="cookie-section">
        <summary>微博 Cookie 配置</summary>
        <div class="cookie-body">
          <div class="meta" id="cookieStatus" style="margin-bottom:7px;">Cookie 状态：检查中...</div>
          <label for="cookieInput">粘贴微博 Cookie（登录后从浏览器开发者工具复制）</label>
          <textarea id="cookieInput" placeholder="SUB=xxx; SUBP=xxx; ..." style="min-height:60px;font-size:11px;font-family:monospace;"></textarea>
          <div class="row">
            <button id="saveCookieBtn" class="secondary">保存 Cookie</button>
            <button id="clearCookieBtn" class="danger">清除 Cookie</button>
          </div>
        </div>
      </details>
      <div class="meta" id="stateText">状态：未启动</div>
      <div class="meta" id="lastUpdateText">上次更新：--</div>
      <div class="meta" id="hitText">命中：--</div>
      <div class="logs" id="logWrap"><div class="empty">暂无日志</div></div>
    </aside>

    <main class="card">
      <div class="status-card" id="keywordStatus">等待开始监控...</div>
      <div class="grid">
        <section>
          <div class="headline">
            <h2 class="panel-title">全国热搜前50</h2>
            <a href="https://s.weibo.com/top/summary?cate=realtimehot" target="_blank" rel="noreferrer">打开微博热搜</a>
          </div>
          <table>
            <thead><tr><th class="rank">排名</th><th>关键词</th><th>热度</th><th>命中</th></tr></thead>
            <tbody id="nationalBody"><tr><td colspan="4" class="empty">暂无数据</td></tr></tbody>
          </table>
        </section>
        <section>
          <div class="headline">
            <h2 class="panel-title">文娱榜</h2>
            <a href="https://weibo.com/hot/entertainment" target="_blank" rel="noreferrer">打开微博文娱榜</a>
          </div>
          <table>
            <thead><tr><th class="rank">排名</th><th>关键词</th><th>热度</th><th>命中</th></tr></thead>
            <tbody id="entertainmentBody"><tr><td colspan="4" class="empty">暂无数据</td></tr></tbody>
          </table>
        </section>
        <section>
          <div class="headline">
            <h2 class="panel-title">生活榜</h2>
            <a href="https://weibo.com/hot/life" target="_blank" rel="noreferrer">打开微博生活榜</a>
          </div>
          <table>
            <thead><tr><th class="rank">排名</th><th>关键词</th><th>热度</th><th>命中</th></tr></thead>
            <tbody id="lifeBody"><tr><td colspan="4" class="empty">暂无数据</td></tr></tbody>
          </table>
        </section>
        <section>
          <div class="headline">
            <h2 class="panel-title">社会榜</h2>
            <a href="https://weibo.com/hot/social" target="_blank" rel="noreferrer">打开微博社会榜</a>
          </div>
          <table>
            <thead><tr><th class="rank">排名</th><th>关键词</th><th>热度</th><th>命中</th></tr></thead>
            <tbody id="societyBody"><tr><td colspan="4" class="empty">暂无数据</td></tr></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script>
    const STORE_KEY = "wb-monitor-cool-v2";
    const DEFAULT_CONFIG = { refreshSec: 10, keywords: ["示例关键词|别名"], logs: [] };
    const state = { config: loadConfig(), monitoring: false, timer: null, notified: new Set(), notificationEnabled: false, lastRanks: new Map() };
    const el = {
      keywordsInput: document.getElementById("keywordsInput"),
      refreshSec: document.getElementById("refreshSec"),
      saveBtn: document.getElementById("saveBtn"),
      toggleBtn: document.getElementById("toggleBtn"),
      notifyBtn: document.getElementById("notifyBtn"),
      clearLogBtn: document.getElementById("clearLogBtn"),
      stateText: document.getElementById("stateText"),
      lastUpdateText: document.getElementById("lastUpdateText"),
      hitText: document.getElementById("hitText"),
      logWrap: document.getElementById("logWrap"),
      keywordStatus: document.getElementById("keywordStatus"),
      nationalBody: document.getElementById("nationalBody"),
      entertainmentBody: document.getElementById("entertainmentBody"),
      lifeBody: document.getElementById("lifeBody"),
      societyBody: document.getElementById("societyBody"),
      cookieStatus: document.getElementById("cookieStatus"),
      cookieInput: document.getElementById("cookieInput"),
      saveCookieBtn: document.getElementById("saveCookieBtn"),
      clearCookieBtn: document.getElementById("clearCookieBtn"),
      cookieBadge: document.getElementById("cookieBadge"),
      cookieSection: document.querySelector("details.cookie-section")
    };

    function setCookieBadge(level, text) {
      if (!el.cookieBadge) return;
      el.cookieBadge.className = "cookie-badge " + level;
      el.cookieBadge.textContent = "● " + text;
    }
    el.cookieBadge?.addEventListener("click", () => {
      if (el.cookieSection) {
        el.cookieSection.open = true;
        el.cookieSection.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return structuredClone(DEFAULT_CONFIG);
        const cfg = JSON.parse(raw);
        return {
          refreshSec: Number(cfg.refreshSec) || 10,
          keywords: Array.isArray(cfg.keywords) ? cfg.keywords : [],
          logs: Array.isArray(cfg.logs) ? cfg.logs.slice(0, 200) : []
        };
      } catch {
        return structuredClone(DEFAULT_CONFIG);
      }
    }
    function saveConfig() { localStorage.setItem(STORE_KEY, JSON.stringify(state.config)); }
    function syncForm() {
      el.keywordsInput.value = state.config.keywords.join("\n");
      el.refreshSec.value = state.config.refreshSec;
      renderLogs();
    }
    function parseKeywords() {
      return el.keywordsInput.value.split("\n").map((line) => line.trim()).filter(Boolean);
    }
    function normalizeText(input) {
      return String(input || "").toLowerCase().replace(/[＃#\s]/g, "").replace(/[^\p{L}\p{N}]/gu, "");
    }
    function keywordLineToAliases(line) {
      const aliases = String(line).split("|").map((item) => item.trim()).filter(Boolean);
      return aliases.length ? aliases : [String(line)];
    }
    function escapeHtml(str) {
      return String(str).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;");
    }
    function setState(msg, level) {
      const cls = level === "ok" ? "ok" : level === "warn" ? "warn" : "error";
      el.stateText.innerHTML = `状态：<span class="${cls}">${escapeHtml(msg)}</span>`;
    }
    function addLog(msg) {
      const stamp = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      state.config.logs.unshift(`[${stamp}] ${msg}`);
      state.config.logs = state.config.logs.slice(0, 200);
      saveConfig();
      renderLogs();
    }
    function renderLogs() {
      if (!state.config.logs.length) {
        el.logWrap.innerHTML = '<div class="empty">暂无日志</div>';
        return;
      }
      el.logWrap.innerHTML = state.config.logs.map((line) => `<div class="log-item">${escapeHtml(line)}</div>`).join("");
    }
    function isHit(keyword, targets) {
      const normalizedWord = normalizeText(keyword);
      return targets.some((line) => keywordLineToAliases(line).some((alias) => {
        const nAlias = normalizeText(alias);
        return nAlias && (normalizedWord.includes(nAlias) || nAlias.includes(normalizedWord));
      }));
    }
    function compareRankAndLog(key, board, rank) {
      const mapKey = `${board}:${key}`;
      const old = state.lastRanks.get(mapKey);
      if (!old) addLog(`${board}新增命中：${key} #${rank}`);
      else if (old !== rank) addLog(`${board}排名变动：${key} #${old} -> #${rank}`);
      state.lastRanks.set(mapKey, rank);
    }
    function triggerNotification(title, body, tag) {
      if (!state.notificationEnabled || !("Notification" in window)) return;
      if (state.notified.has(tag)) return;
      state.notified.add(tag);
      const n = new Notification(title, { body, tag });
      n.onclick = () => window.focus();
    }
    function renderBoard(bodyEl, rows, keywords, boardName) {
      if (!Array.isArray(rows) || !rows.length) {
        bodyEl.innerHTML = '<tr><td colspan="4" class="empty">暂无数据</td></tr>';
        return 0;
      }
      let hitCount = 0;
      bodyEl.innerHTML = rows.slice(0, 50).map((item) => {
        const hit = isHit(item.keyword, keywords);
        if (hit) {
          hitCount += 1;
          compareRankAndLog(item.keyword, boardName, item.rank);
          triggerNotification("关键词命中提醒", `${boardName}：${item.keyword} 第${item.rank}位`, `${boardName}-${item.keyword}-${item.rank}`);
        }
        const link = item.url || `https://s.weibo.com/weibo?q=${encodeURIComponent(item.keyword)}`;
        return `
          <tr class="${hit ? "hit-row" : ""}">
            <td class="rank">#${item.rank}</td>
            <td><a href="${link}" target="_blank" rel="noreferrer" style="color:#e6edff;text-decoration:none;">${escapeHtml(item.keyword)}</a>${item.label ? `<span class="tag">${escapeHtml(item.label)}</span>` : ""}</td>
            <td>${escapeHtml(item.hot || "--")}</td>
            <td>${hit ? '<span class="hit">命中</span>' : "-"}</td>
          </tr>
        `;
      }).join("");
      return hitCount;
    }
    function renderKeywordStatus(rows, hasCookie, cookieExpired) {
      if (!rows.length) { el.keywordStatus.innerHTML = "请先设置关键词再启动监控。"; return; }
      const html = rows.map((row) => {
        const r = row.realtimeRank ? `<span class="hit">全国 #${row.realtimeRank}</span>` : "全国未上榜";
        const e = row.entertainmentRank ? ` / <span class="hit">文娱 #${row.entertainmentRank}</span>` : " / 文娱未上榜";
        const l = row.lifeRank ? ` / <span class="hit">生活 #${row.lifeRank}</span>` : " / 生活未上榜";
        const s = row.societyRank ? ` / <span class="hit">社会 #${row.societyRank}</span>` : " / 社会未上榜";
        return `<div>【${escapeHtml(row.keyword)}】${r}${e}${l}${s}</div>`;
      }).join("");
      let tip = "";
      if (cookieExpired) {
        tip = `<div style="margin-top:6px;color:#ff7f99;">❌ WEIBO_COOKIE 已失效（微博服务器拒绝），请重新登录微博网页版抓取最新 Cookie 后在下方"微博 Cookie"框粘贴保存</div>`;
      } else if (!hasCookie) {
        tip = `<div style="margin-top:6px;color:#ffce4d;">⚠️ 未配置 WEIBO_COOKIE，文娱/生活/社会榜无数据</div>`;
      }
      el.keywordStatus.innerHTML = html + tip;
    }
    async function fetchData() {
      const keywords = state.config.keywords;
      const qs = encodeURIComponent(keywords.join(","));
      const res = await fetch(`/api/weibo/hot?keywords=${qs}`);
      if (!res.ok) throw new Error(`接口异常 ${res.status}`);
      return res.json();
    }
    async function pullOnce() {
      if (!state.config.keywords.length) { setState("请先填写关键词", "warn"); return; }
      try {
        const data = await fetchData();
        const nHits = renderBoard(el.nationalBody, data.realtime || [], state.config.keywords, "全国热搜");
        const eHits = renderBoard(el.entertainmentBody, data.entertainment || [], state.config.keywords, "文娱榜");
        const lHits = renderBoard(el.lifeBody, data.life || [], state.config.keywords, "生活榜");
        const sHits = renderBoard(el.societyBody, data.society || [], state.config.keywords, "社会榜");
        renderKeywordStatus(data.keywordStatus || [], data.hasCookie, data.cookieExpired);
        if (data.cookieExpired) {
          el.cookieStatus.textContent = "Cookie 状态：已失效（微博服务器拒绝），请重新获取并保存";
          el.cookieStatus.className = "meta error";
          setCookieBadge("bad", "Cookie 失效");
        } else if (!data.hasCookie) {
          setCookieBadge("warn", "Cookie 未配置");
        } else {
          setCookieBadge("ok", "Cookie 正常");
        }
        el.hitText.textContent = `命中：全国 ${nHits} / 文娱 ${eHits} / 生活 ${lHits} / 社会 ${sHits}`;
        el.lastUpdateText.textContent = `上次更新：${new Date().toLocaleString("zh-CN", { hour12: false })}`;
        setState("监控中", "ok");
      } catch (err) {
        setState(`拉取失败：${err.message}`, "error");
      }
    }
    async function start() {
      if (state.monitoring) return;
      const keywords = parseKeywords();
      if (!keywords.length) {
        setState("请先填写关键词后再启动", "warn");
        return;
      }
      state.config.keywords = keywords;
      state.config.refreshSec = Math.max(5, Number(el.refreshSec.value) || 10);
      saveConfig();
      state.monitoring = true;
      el.toggleBtn.textContent = "停止监控";
      addLog(`开始监控，间隔=${state.config.refreshSec}s`);
      await pullOnce();
      state.timer = setInterval(pullOnce, state.config.refreshSec * 1000);
    }
    function stop() {
      if (!state.monitoring) return;
      state.monitoring = false;
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      el.toggleBtn.textContent = "开始监控";
      setState("已停止", "warn");
      addLog("已停止监控");
    }
    async function enableNotify() {
      if (!("Notification" in window)) {
        setState("浏览器不支持通知", "error");
        return;
      }
      const p = await Notification.requestPermission();
      if (p === "granted") {
        state.notificationEnabled = true;
        el.notifyBtn.textContent = "通知已开启";
        setState("通知已开启", "ok");
      } else {
        setState("通知未授权", "warn");
      }
    }
    el.saveBtn.addEventListener("click", () => {
      const running = state.monitoring;
      if (running) stop();
      state.config.keywords = parseKeywords();
      state.config.refreshSec = Math.max(5, Number(el.refreshSec.value) || 10);
      saveConfig();
      addLog("配置已保存");
      setState("配置已保存", "ok");
      if (running) start();
    });
    el.toggleBtn.addEventListener("click", () => (state.monitoring ? stop() : start()));
    el.notifyBtn.addEventListener("click", enableNotify);
    el.clearLogBtn.addEventListener("click", () => {
      state.config.logs = [];
      saveConfig();
      renderLogs();
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.reload();
    });

    // Cookie management
    async function loadCookieStatus() {
      try {
        const res = await fetch("/api/config/cookie");
        const data = await res.json();
        el.cookieStatus.textContent = data.hasCookie
          ? `Cookie 状态：已配置（${data.cookieLength} 字符）`
          : "Cookie 状态：未配置 — 文娱/生活/社会榜无数据";
        el.cookieStatus.className = "meta " + (data.hasCookie ? "ok" : "warn");
        setCookieBadge(data.hasCookie ? "ok" : "warn", data.hasCookie ? "Cookie 已配置" : "Cookie 未配置");
      } catch {
        el.cookieStatus.textContent = "Cookie 状态：检查失败";
        el.cookieStatus.className = "meta error";
        setCookieBadge("bad", "Cookie 检查失败");
      }
    }
    async function saveCookie(cookie) {
      el.saveCookieBtn.disabled = true;
      el.clearCookieBtn.disabled = true;
      try {
        const res = await fetch("/api/config/cookie", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cookie })
        });
        const data = await res.json();
        if (data.ok) {
          el.cookieInput.value = "";
          await loadCookieStatus();
          addLog(cookie ? "微博 Cookie 已更新" : "微博 Cookie 已清除");
        }
      } catch {
        el.cookieStatus.textContent = "Cookie 状态：保存失败";
        el.cookieStatus.className = "meta error";
      }
      el.saveCookieBtn.disabled = false;
      el.clearCookieBtn.disabled = false;
    }
    el.saveCookieBtn.addEventListener("click", () => saveCookie(el.cookieInput.value.trim()));
    el.clearCookieBtn.addEventListener("click", () => { if (confirm("确认清除 Cookie？")) saveCookie(""); });
    loadCookieStatus();

    syncForm();
  </script>
</body>
</html>
